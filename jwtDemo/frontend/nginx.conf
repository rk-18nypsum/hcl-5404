server{
  listen:80;
  root/usr/share/nginx/html;
  index index.html

  #React single-page app
  location / {
    try_files $url /index.html
  }
   #forward /api/  calls to springboot container

   location /api/ {
    proxy_pass http:/bakend:8080/api/v1;
    proxy-set_header Host $host;
  proxy-set_header X-Real-IP $remote
  proxy-set_header
   }
}